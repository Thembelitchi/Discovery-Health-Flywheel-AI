name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be started by hand from the Actions tab. Without this the only way
  # to get a result is a push or a re-run of an existing run, and a re-run
  # reuses the original run's configuration rather than building a fresh one.
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Fails if package-lock.json drifts from package.json, which is how a
      # lockfile belonging to a different project went unnoticed.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
